[package]
name = "tba-cli"
version = "0.2.9"
edition = "2021"
description = "TBA - Teambition Agent (CLI + MCP + egui 窗口)"
default-run = "tba"

[[bin]]
name = "tba"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "default-tls"] }
# 邮件：SMTP 发信 / IMAP 收信。native-tls 走 Windows schannel，
# 跟 reqwest 的 default-tls 是同一个后端，不额外拉 openssl/ring。
native-tls = "0.2"
chrono = { version = "0.4", features = ["clock"] }
# 截图压缩：png 0.18 内置 fdeflate（专为 PNG 调的 deflate），
# 自适应滤波 + 极快压缩，比手写 stored 块小一个数量级。
png = "0.18"
# 文件选择对话框：but 找不到时让用户自己指位置（不扫盘）。
# Windows 走 IFileOpenDialog，不额外拉 gtk；linux 需要 xdg-portal，本项目只发 Windows 包。
rfd = { version = "0.15", default-features = false }
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
opt-level = 2
debug = false
