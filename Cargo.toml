[package]
name = "tbhub"
version = "0.1.0"
edition = "2021"
description = "TBHub - Teambition 共享 Skill / 任务中枢 (CLI + MCP + egui 窗口)"
default-run = "tb"

[[bin]]
name = "tb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "default-tls"] }
chrono = { version = "0.4", features = ["clock"] }
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
opt-level = 2
debug = false
