# 主线程默认栈只有 1MB。clap 的 derive 会把整个子命令树编进一个巨大的
# build_cli 函数，debug 构建下这个栈帧能顶到 1MB 上限——加一个子命令就可能
# 让 `tba --version` 直接 stack overflow（release 因为优化过反而没事）。
# 统一给 8MB：debug/release 都够用，GUI 的深调用链也顺带受益。
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

# 只认 MSVC：发布包是 msvc 目标编的，GNU 工具链的 exe 依赖 mingw 运行时，
# 行为不一致。这里不给 gnu 兜底——本机缺 SDK 时用 `tba toolchain set` 指定
# 位置（GUI 设置页也能点），而不是换一套工具链悄悄编出不一样的东西。
