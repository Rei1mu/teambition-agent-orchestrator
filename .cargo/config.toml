# 主线程默认栈只有 1MB。clap 的 derive 会把整个子命令树编进一个巨大的
# build_cli 函数，debug 构建下这个栈帧能顶到 1MB 上限——加一个子命令就可能
# 让 `tba --version` 直接 stack overflow（release 因为优化过反而没事）。
# 统一给 8MB：debug/release 都够用，GUI 的深调用链也顺带受益。
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

# GNU 工具链不认 /STACK 语法，同样的 8MB 要用 ld 的参数写法。
# 本机没装 Windows SDK 时 msvc 链不了，只能靠 gnu 跑测试和本地验证，
# 所以这条也得有，否则 `tba --version` 在 gnu debug 下一样会爆栈。
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-Wl,--stack,8388608"]
